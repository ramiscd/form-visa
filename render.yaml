databases:
  - name: form-visa-db
    plan: starter

services:
  - type: web
    name: form-visa-back
    runtime: ruby
    plan: starter
    rootDir: back
    buildCommand: bundle install
    startCommand: bundle exec rails db:prepare && bundle exec puma -C config/puma.rb
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: form-visa-db
          property: connectionString

      - key: SECRET_KEY_BASE
        generateValue: true

      - key: ASAAS_WEBHOOK_TOKEN
        sync: false

    autoDeployTrigger: commit

  - type: web
    name: form-visa-front
    runtime: node
    plan: starter
    rootDir: front
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://form-visa-back.onrender.com/api
    autoDeployTrigger: commit